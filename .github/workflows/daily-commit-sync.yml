name: Daily GitHub Commits Sync

on:
  schedule:
    # Runs daily at midnight UTC (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions web UI

# Prevent concurrent overlapping executions
concurrency:
  group: daily-commit-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync Latest Commit Snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-commits.js

      - name: Commit and Push if Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/github-commits-snapshot.json
          if git diff --cached --quiet; then
            echo "No new commits detected across portfolio repositories."
          else
            git commit -m "chore(data): sync latest github commits snapshot"
            git push
            echo "Pushed updated commit snapshot to main."
          fi
