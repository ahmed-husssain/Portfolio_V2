<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .bg { fill: #0A0A0C; }
      .grid { stroke: #181822; stroke-width: 1; stroke-dasharray: 4 4; }
      .card { fill: #111116; stroke: #23232E; stroke-width: 1.5; }
      .card-emerald { fill: #101513; stroke: #10B981; stroke-width: 1.5; }
      .mono-head { font-family: 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; fill: #71717A; letter-spacing: 0.12em; }
      .mono-title { font-family: 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 16px; font-weight: 600; fill: #EDEDED; letter-spacing: 0.04em; }
      .mono-sub { font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; fill: #A1A1AA; }
      .letter { font-family: 'Geist Mono', monospace; font-size: 24px; font-weight: 700; fill: #10B981; }
      .principle-title { font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 600; fill: #EDEDED; }
      .principle-sub { font-family: 'Geist', sans-serif; font-size: 10px; fill: #94A3B8; }
      .badge-text { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 600; fill: #10B981; }
      .rule-text { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #CBD5E1; }
      .bottom-note { font-family: 'Geist Mono', monospace; font-size: 10px; fill: #10B981; letter-spacing: 0.08em; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="880" height="480" class="bg" />

  <!-- Blueprint Grid -->
  <line x1="30" y1="0" x2="30" y2="480" class="grid" />
  <line x1="850" y1="0" x2="850" y2="480" class="grid" />
  <line x1="0" y1="50" x2="880" y2="50" class="grid" />
  <line x1="0" y1="425" x2="880" y2="425" class="grid" />

  <!-- Header -->
  <text x="40" y="32" class="mono-head">C# BACKEND ENGINEERING // OBJECT-ORIENTED ARCHITECTURE</text>
  <text x="40" y="80" class="mono-title">THE SOLID PRINCIPLES BLUEPRINT</text>
  <text x="40" y="102" class="mono-sub">Five defensive engineering habits for resilient, testable, and maintainable C# applications.</text>

  <!-- Pillar 1: S (Single Responsibility) -->
  <g transform="translate(40, 130)">
    <rect width="150" height="260" rx="4" class="card-emerald" />
    <rect x="12" y="12" width="28" height="20" rx="3" fill="#064E3B" />
    <text x="21" y="26" class="badge-text">S</text>
    <text x="12" y="55" class="letter">SRP</text>
    <text x="12" y="78" class="principle-title">Single</text>
    <text x="12" y="93" class="principle-title">Responsibility</text>
    
    <line x1="12" y1="108" x2="138" y2="108" stroke="#1F2937" stroke-width="1" />
    <text x="12" y="128" class="principle-sub">CORE PROMISE:</text>
    <text x="12" y="145" class="rule-text">One class = One job.</text>
    <text x="12" y="162" class="rule-text">One reason to change.</text>
    
    <line x1="12" y1="185" x2="138" y2="185" stroke="#1F2937" stroke-width="1" />
    <text x="12" y="205" class="principle-sub">ANALOGY:</text>
    <text x="12" y="222" class="rule-text">Chef cooks;</text>
    <text x="12" y="239" class="rule-text">Waiter serves.</text>
  </g>

  <!-- Pillar 2: O (Open/Closed) -->
  <g transform="translate(202, 130)">
    <rect width="150" height="260" rx="4" class="card" />
    <rect x="12" y="12" width="28" height="20" rx="3" fill="#1E293B" />
    <text x="21" y="26" class="badge-text" fill="#94A3B8">O</text>
    <text x="12" y="55" class="letter" fill="#E2E8F0">OCP</text>
    <text x="12" y="78" class="principle-title">Open /</text>
    <text x="12" y="93" class="principle-title">Closed</text>
    
    <line x1="12" y1="108" x2="138" y2="108" stroke="#1F2937" stroke-width="1" />
    <text x="12" y="128" class="principle-sub">CORE PROMISE:</text>
    <text x="12" y="145" class="rule-text">Extend via new code,</text>
    <text x="12" y="162" class="rule-text">never edit old code.</text>
    
    <line x1="12" y1="185" x2="138" y2="185" stroke="#1F2937" stroke-width="1" />
    <text x="12" y="205" class="principle-sub">ANALOGY:</text>
    <text x="12" y="222" class="rule-text">Phone app store</text>
    <text x="12" y="239" class="rule-text">vs rewiring chip.</text>
  </g>

  <!-- Pillar 3: L (Liskov Substitution) -->
  <g transform="translate(364, 130)">
    <rect width="150" height="260" rx="4" class="card" />
    <rect x="12" y="12" width="28" height="20" rx="3" fill="#1E293B" />
    <text x="21" y="26" class="badge-text" fill="#94A3B8">L</text>
    <text x="12" y="55" class="letter" fill="#E2E8F0">LSP</text>
    <text x="12" y="78" class="principle-title">Liskov</text>
    <text x="12" y="93" class="principle-title">Substitution</text>
    
    <line x1="12" y1="108" x2="138" y2="108" stroke="#1F2937" stroke-width="1" />
    <text x="12" y="128" class="principle-sub">CORE PROMISE:</text>
    <text x="12" y="145" class="rule-text">Child class must not</text>
    <text x="12" y="162" class="rule-text">break parent contract.</text>
    
    <line x1="12" y1="185" x2="138" y2="185" stroke="#1F2937" stroke-width="1" />
    <text x="12" y="205" class="principle-sub">ANALOGY:</text>
    <text x="12" y="222" class="rule-text">Real duck vs</text>
    <text x="12" y="239" class="rule-text">Toy duck in lake.</text>
  </g>

  <!-- Pillar 4: I (Interface Segregation) -->
  <g transform="translate(526, 130)">
    <rect width="150" height="260" rx="4" class="card" />
    <rect x="12" y="12" width="28" height="20" rx="3" fill="#1E293B" />
    <text x="21" y="26" class="badge-text" fill="#94A3B8">I</text>
    <text x="12" y="55" class="letter" fill="#E2E8F0">ISP</text>
    <text x="12" y="78" class="principle-title">Interface</text>
    <text x="12" y="93" class="principle-title">Segregation</text>
    
    <line x1="12" y1="108" x2="138" y2="108" stroke="#1F2937" stroke-width="1" />
    <text x="12" y="128" class="principle-sub">CORE PROMISE:</text>
    <text x="12" y="145" class="rule-text">Clients implement only</text>
    <text x="12" y="162" class="rule-text">what they use.</text>
    
    <line x1="12" y1="185" x2="138" y2="185" stroke="#1F2937" stroke-width="1" />
    <text x="12" y="205" class="principle-sub">ANALOGY:</text>
    <text x="12" y="222" class="rule-text">Ordering a drink,</text>
    <text x="12" y="239" class="rule-text">not the buffet.</text>
  </g>

  <!-- Pillar 5: D (Dependency Inversion) -->
  <g transform="translate(688, 130)">
    <rect width="150" height="260" rx="4" class="card-emerald" />
    <rect x="12" y="12" width="28" height="20" rx="3" fill="#064E3B" />
    <text x="21" y="26" class="badge-text">D</text>
    <text x="12" y="55" class="letter">DIP</text>
    <text x="12" y="78" class="principle-title">Dependency</text>
    <text x="12" y="93" class="principle-title">Inversion</text>
    
    <line x1="12" y1="108" x2="138" y2="108" stroke="#1F2937" stroke-width="1" />
    <text x="12" y="128" class="principle-sub">CORE PROMISE:</text>
    <text x="12" y="145" class="rule-text">Depend on interfaces,</text>
    <text x="12" y="162" class="rule-text">not concrete classes.</text>
    
    <line x1="12" y1="185" x2="138" y2="185" stroke="#1F2937" stroke-width="1" />
    <text x="12" y="205" class="principle-sub">ANALOGY:</text>
    <text x="12" y="222" class="rule-text">Wall socket plug</text>
    <text x="12" y="239" class="rule-text">vs hardwired lamp.</text>
  </g>

  <!-- Footer Telemetry -->
  <text x="40" y="450" class="bottom-note">// SENIOR DEV RULE: AVOID PREMATURE ABSTRACTION · CODE READABILITY &gt; DOGMATIC PURITY</text>
</svg>
