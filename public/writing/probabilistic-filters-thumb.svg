<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .bg { fill: #0A0A0C; }
      .grid { stroke: #16161D; stroke-width: 1; stroke-dasharray: 4 4; }
      .card { fill: #111116; stroke: #23232E; stroke-width: 1.5; }
      .card-glow { fill: #13131A; stroke: #38BDF8; stroke-width: 1.5; }
      .mono-head { font-family: 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; fill: #71717A; letter-spacing: 0.12em; }
      .mono-title { font-family: 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 15px; font-weight: 600; fill: #EDEDED; letter-spacing: 0.04em; }
      .mono-sub { font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; fill: #A1A1AA; }
      .card-title { font-family: 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #EDEDED; }
      .card-tag { font-family: 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 9px; }
      .card-desc { font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #94A3B8; }
      .card-stat { font-family: 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #F1F5F9; }
      .stat-lbl { font-family: 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 9px; fill: #64748B; }
      .conn-line { stroke: #2E2E3E; stroke-width: 2; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <!-- Dark Background -->
  <rect width="880" height="480" class="bg" />

  <!-- Subtle Blueprint Grid -->
  <line x1="30" y1="0" x2="30" y2="480" class="grid" />
  <line x1="850" y1="0" x2="850" y2="480" class="grid" />
  <line x1="0" y1="50" x2="880" y2="50" class="grid" />
  <line x1="0" y1="430" x2="880" y2="430" class="grid" />

  <!-- Top Telemetry Header -->
  <text x="40" y="32" class="mono-head">SYSTEM DESIGN // APPROXIMATE MEMBERSHIP QUERY ARCHITECTURES</text>
  <text x="40" y="76" class="mono-title">PROBABILISTIC FILTERS: THE 50-YEAR EVOLUTION</text>
  <text x="40" y="96" class="mono-sub">Tracing how space-efficiency, CPU cache misses, and deletion mechanics evolved from 1970 to 2020.</text>

  <!-- Connecting Timeline Line -->
  <line x1="120" y1="128" x2="760" y2="128" class="conn-line" />

  <!-- CARD 1: BLOOM FILTER (1970) -->
  <g transform="translate(40, 140)">
    <rect width="185" height="260" rx="4" class="card" />
    <rect x="10" y="10" width="50" height="18" rx="2" fill="#1E293B" />
    <text x="16" y="22" class="card-tag" fill="#60A5FA">1970</text>
    <text x="10" y="46" class="card-title">Bloom Filter</text>
    <text x="10" y="62" class="card-desc">Bit array + k hashes</text>

    <!-- Mini Visual -->
    <g transform="translate(10, 75)">
      <rect x="0" y="0" width="16" height="14" rx="1" fill="#1E1E26" stroke="#333342" />
      <rect x="18" y="0" width="16" height="14" rx="1" fill="#60A5FA" stroke="#93C5FD" />
      <rect x="36" y="0" width="16" height="14" rx="1" fill="#1E1E26" stroke="#333342" />
      <rect x="54" y="0" width="16" height="14" rx="1" fill="#60A5FA" stroke="#93C5FD" />
      <rect x="72" y="0" width="16" height="14" rx="1" fill="#1E1E26" stroke="#333342" />
      <rect x="90" y="0" width="16" height="14" rx="1" fill="#60A5FA" stroke="#93C5FD" />
    </g>

    <text x="10" y="112" class="card-desc">• Streaming inserts</text>
    <text x="10" y="128" class="card-desc">• No deletions allowed</text>
    <text x="10" y="144" class="card-desc">• k random cache misses</text>

    <line x1="10" y1="160" x2="175" y2="160" stroke="#1E1E28" />
    <text x="10" y="180" class="stat-lbl">SPACE: <tspan class="card-stat">~10.0 bits/key</tspan></text>
    <text x="10" y="200" class="stat-lbl">DELETIONS: <tspan class="card-stat">No</tspan></text>
    <text x="10" y="220" class="stat-lbl">SEEK COST: <tspan class="card-stat">k reads (High)</tspan></text>
    <text x="10" y="240" class="stat-lbl">TYPE: <tspan class="card-stat">Dynamic</tspan></text>
  </g>

  <!-- CARD 2: CUCKOO FILTER (2014) -->
  <g transform="translate(245, 140)">
    <rect width="185" height="260" rx="4" class="card" />
    <rect x="10" y="10" width="50" height="18" rx="2" fill="#064E3B" />
    <text x="16" y="22" class="card-tag" fill="#34D399">2014</text>
    <text x="10" y="46" class="card-title">Cuckoo Filter</text>
    <text x="10" y="62" class="card-desc">Fingerprint buckets</text>

    <!-- Mini Visual -->
    <g transform="translate(10, 75)">
      <rect x="0" y="0" width="38" height="14" rx="1" fill="#34D399" stroke="#6EE7B7" />
      <rect x="42" y="0" width="38" height="14" rx="1" fill="#1E1E26" stroke="#333342" />
      <text x="86" y="11" class="stat-lbl">b1 ⊕ b2</text>
    </g>

    <text x="10" y="112" class="card-desc">• Supports O(1) deletes</text>
    <text x="10" y="128" class="card-desc">• Checks max 2 buckets</text>
    <text x="10" y="144" class="card-desc">• High cache locality</text>

    <line x1="10" y1="160" x2="175" y2="160" stroke="#1E1E28" />
    <text x="10" y="180" class="stat-lbl">SPACE: <tspan class="card-stat">~8.4 – 9.0 bits</tspan></text>
    <text x="10" y="200" class="stat-lbl">DELETIONS: <tspan class="card-stat">Yes (O(1))</tspan></text>
    <text x="10" y="220" class="stat-lbl">SEEK COST: <tspan class="card-stat">2 reads max</tspan></text>
    <text x="10" y="240" class="stat-lbl">TYPE: <tspan class="card-stat">Dynamic</tspan></text>
  </g>

  <!-- CARD 3: XOR FILTER (2019) -->
  <g transform="translate(450, 140)">
    <rect width="185" height="260" rx="4" class="card" />
    <rect x="10" y="10" width="50" height="18" rx="2" fill="#451A03" />
    <text x="16" y="22" class="card-tag" fill="#F59E0B">2019</text>
    <text x="10" y="46" class="card-title">XOR Filter</text>
    <text x="10" y="62" class="card-desc">3-way linear peeling</text>

    <!-- Mini Visual -->
    <g transform="translate(10, 75)">
      <rect x="0" y="0" width="24" height="14" rx="1" fill="#1E1E26" stroke="#333342" />
      <text x="27" y="11" class="stat-lbl">⊕</text>
      <rect x="36" y="0" width="24" height="14" rx="1" fill="#F59E0B" stroke="#FCD34D" />
      <text x="63" y="11" class="stat-lbl">⊕</text>
      <rect x="72" y="0" width="24" height="14" rx="1" fill="#1E1E26" stroke="#333342" />
    </g>

    <text x="10" y="112" class="card-desc">• 20% smaller than Bloom</text>
    <text x="10" y="128" class="card-desc">• Exactly 3 memory reads</text>
    <text x="10" y="144" class="card-desc">• Built once from batch</text>

    <line x1="10" y1="160" x2="175" y2="160" stroke="#1E1E28" />
    <text x="10" y="180" class="stat-lbl">SPACE: <tspan class="card-stat">~9.8 bits/key</tspan></text>
    <text x="10" y="200" class="stat-lbl">DELETIONS: <tspan class="card-stat">No (Immutable)</tspan></text>
    <text x="10" y="220" class="stat-lbl">SEEK COST: <tspan class="card-stat">3 reads</tspan></text>
    <text x="10" y="240" class="stat-lbl">TYPE: <tspan class="card-stat">Static (Fast)</tspan></text>
  </g>

  <!-- CARD 4: BINARY FUSE FILTER (2020) -->
  <g transform="translate(655, 140)">
    <rect width="185" height="260" rx="4" class="card-glow" />
    <rect x="10" y="10" width="50" height="18" rx="2" fill="#2E1065" />
    <text x="16" y="22" class="card-tag" fill="#A78BFA">2020</text>
    <text x="10" y="46" class="card-title">Binary Fuse</text>
    <text x="10" y="62" class="card-desc">Overlapping windows</text>

    <!-- Mini Visual -->
    <g transform="translate(10, 75)">
      <rect x="0" y="0" width="24" height="14" rx="1" fill="#A78BFA" stroke="#C4B5FD" />
      <rect x="16" y="0" width="24" height="14" rx="1" fill="#1E1E26" stroke="#333342" />
      <rect x="32" y="0" width="24" height="14" rx="1" fill="#A78BFA" stroke="#C4B5FD" />
      <text x="62" y="11" class="stat-lbl">Fused</text>
    </g>

    <text x="10" y="112" class="card-desc">• ~1.12 bits/key bound</text>
    <text x="10" y="128" class="card-desc">• Near-instant O(N) build</text>
    <text x="10" y="144" class="card-desc">• Modern state of art</text>

    <line x1="10" y1="160" x2="175" y2="160" stroke="#1E1E28" />
    <text x="10" y="180" class="stat-lbl">SPACE: <tspan class="card-stat">~8.9 bits (Optimal)</tspan></text>
    <text x="10" y="200" class="stat-lbl">DELETIONS: <tspan class="card-stat">No (Immutable)</tspan></text>
    <text x="10" y="220" class="stat-lbl">SEEK COST: <tspan class="card-stat">3 reads (Tuned)</tspan></text>
    <text x="10" y="240" class="stat-lbl">TYPE: <tspan class="card-stat">Static (Optimal)</tspan></text>
  </g>

  <!-- Bottom Summary Telemetry -->
  <text x="40" y="455" class="mono-head">SUMMARY // DYNAMIC WORKLOADS: USE CUCKOO (O(1) DELETIONS) · STATIC SSTABLES: USE BINARY FUSE (1.12 BITS/KEY)</text>
</svg>
