<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .bg { fill: #0A0A0C; }
      .grid { stroke: #16161D; stroke-width: 1; stroke-dasharray: 4 4; }
      .box-panel { fill: #111116; stroke: #23232E; stroke-width: 1.5; }
      .mono-head { font-family: 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; fill: #71717A; letter-spacing: 0.12em; }
      .mono-title { font-family: 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 15px; font-weight: 600; fill: #EDEDED; letter-spacing: 0.04em; }
      .mono-sub { font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; fill: #A1A1AA; }
      .code-font { font-family: 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #6EE7B7; }
      .text-desc { font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11.5px; fill: #CBD5E1; }
      .bucket-box { fill: #171720; stroke: #2E2E3E; stroke-width: 1; }
      .slot-active { fill: #065F46; stroke: #34D399; stroke-width: 1; }
      .slot-empty { fill: #13131A; stroke: #262633; stroke-width: 1; stroke-dasharray: 2 2; }
      .stat-val { font-family: 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #EDEDED; }
      .stat-lbl { font-family: 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 9.5px; fill: #64748B; }
      .cuckoo-arrow { stroke: #34D399; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="860" height="460" class="bg" />

  <line x1="30" y1="0" x2="30" y2="460" class="grid" />
  <line x1="830" y1="0" x2="830" y2="460" class="grid" />
  <line x1="0" y1="45" x2="860" y2="45" class="grid" />
  <line x1="0" y1="415" x2="860" y2="415" class="grid" />

  <!-- Header -->
  <text x="40" y="28" class="mono-head">FIG 2.0 // MUTABLE AMQ DATA STRUCTURE</text>
  <text x="40" y="70" class="mono-title">CUCKOO FILTER (2014) — 2-BUCKET LOCALITY &amp; O(1) DELETIONS</text>
  <text x="40" y="90" class="mono-sub">Stores fingerprints in 4-slot associative buckets. Deletions are native and lookups only probe 2 contiguous locations.</text>

  <!-- LEFT PANEL: Partial-Key Cuckoo Hashing Mechanics -->
  <g transform="translate(40, 115)">
    <rect width="280" height="275" rx="4" class="box-panel" />
    <text x="16" y="26" class="mono-head" fill="#34D399">PARTIAL-KEY HASHING FORMULA</text>

    <!-- Formula Card -->
    <rect x="16" y="42" width="248" height="65" rx="3" fill="#131F1C" stroke="#047857" />
    <text x="26" y="62" class="code-font" font-size="10.5px">b1 = hash(x)</text>
    <text x="26" y="80" class="code-font" font-size="10.5px">b2 = b1 ⊕ hash(fingerprint(x))</text>
    <text x="26" y="96" class="stat-lbl">Alternate bucket derived without original x</text>

    <!-- Visual Eviction Cycle -->
    <text x="16" y="130" class="mono-head" fill="#94A3B8">CUCKOO DISPLACEMENT MECHANIC</text>
    <text x="16" y="152" class="text-desc">• Each bucket holds 4 fingerprint slots.</text>
    <text x="16" y="172" class="text-desc">• If both b1 &amp; b2 are full, "kick out" an</text>
    <text x="16" y="190" class="text-desc">  existing key to its alternate bucket.</text>
    <text x="16" y="210" class="text-desc">• Re-insert displaced key iteratively.</text>
    <text x="16" y="230" class="text-desc">• Achieves &gt;95% space utilization.</text>
  </g>

  <!-- RIGHT PANEL: Bucket Layout & Deletion Walkthrough -->
  <g transform="translate(340, 115)">
    <rect width="480" height="275" rx="4" class="box-panel" />
    <text x="20" y="26" class="mono-head" fill="#6EE7B7">ASSOCIATIVE BUCKET ARRAY (4 SLOTS PER BUCKET)</text>

    <!-- Bucket Display -->
    <g transform="translate(20, 45)">
      <!-- Bucket 1 (b1 = 3) -->
      <g transform="translate(0, 0)">
        <rect width="210" height="75" rx="3" fill="#171720" stroke="#059669" />
        <text x="12" y="20" class="code-font">Bucket #03 (Primary b1)</text>

        <!-- 4 slots inside bucket 3 -->
        <g transform="translate(12, 30)">
          <rect x="0" y="0" width="42" height="30" rx="2" class="slot-active" />
          <text x="8" y="20" class="code-font" font-size="10px">0xA3</text>

          <rect x="47" y="0" width="42" height="30" rx="2" class="slot-active" />
          <text x="55" y="20" class="code-font" font-size="10px">0xF2</text>

          <rect x="94" y="0" width="42" height="30" rx="2" class="slot-empty" />
          <text x="104" y="20" class="stat-lbl">nil</text>

          <rect x="141" y="0" width="42" height="30" rx="2" class="slot-empty" />
          <text x="151" y="20" class="stat-lbl">nil</text>
        </g>
      </g>

      <!-- XOR Alternate Arrow -->
      <g transform="translate(216, 25)">
        <line x1="5" y1="12" x2="25" y2="12" class="cuckoo-arrow" />
        <text x="4" y="32" class="stat-lbl" font-size="8.5px">b1 ⊕ h(fp)</text>
      </g>

      <!-- Bucket 2 (b2 = 11) -->
      <g transform="translate(250, 0)">
        <rect width="190" height="75" rx="3" fill="#171720" stroke="#333342" />
        <text x="12" y="20" class="code-font" fill="#94A3B8">Bucket #11 (Alternate b2)</text>

        <!-- 4 slots inside bucket 11 -->
        <g transform="translate(12, 30)">
          <rect x="0" y="0" width="38" height="30" rx="2" class="slot-active" />
          <text x="7" y="20" class="code-font" font-size="10px">0x1B</text>

          <rect x="43" y="0" width="38" height="30" rx="2" class="slot-active" />
          <text x="50" y="20" class="code-font" font-size="10px">0x4E</text>

          <rect x="86" y="0" width="38" height="30" rx="2" class="slot-active" />
          <text x="93" y="20" class="code-font" font-size="10px">0x99</text>

          <rect x="129" y="0" width="38" height="30" rx="2" class="slot-empty" />
          <text x="139" y="20" class="stat-lbl">nil</text>
        </g>
      </g>
    </g>

    <!-- Why Deletions Work Callout Box -->
    <g transform="translate(20, 138)">
      <rect width="440" height="76" rx="3" fill="#141E19" stroke="#10B981" />
      <text x="12" y="18" class="mono-head" fill="#34D399">NATIVE O(1) DELETION WORKFLOW</text>
      <text x="12" y="36" class="text-desc">To delete key x: compute fp(x), check bucket b1 and bucket b2.</text>
      <text x="12" y="52" class="text-desc">Find matching 0xA3 in Bucket #03 and simply wipe that slot to 'nil'.</text>
      <text x="12" y="68" class="text-desc">Zero side-effects on neighboring keys. No reconstruction required.</text>
    </g>

    <!-- Telemetry Stats row -->
    <line x1="20" y1="230" x2="460" y2="230" stroke="#22222E" />
    <text x="20" y="252" class="stat-lbl">SPACE: <tspan class="stat-val">~8.4 – 9.0 bits</tspan></text>
    <text x="165" y="252" class="stat-lbl">DELETIONS: <tspan class="stat-val" fill="#34D399">Native O(1)</tspan></text>
    <text x="310" y="252" class="stat-lbl">CACHE MISSES: <tspan class="stat-val">2 max</tspan></text>
  </g>

  <!-- Bottom Telemetry Footer -->
  <text x="40" y="440" class="mono-head">VERDICT // IDEAL FOR ACTIVE WRITE SYSTEMS REQUIRING TTL DELETIONS AND MEMORY CACHE EFFICIENCY</text>
</svg>
