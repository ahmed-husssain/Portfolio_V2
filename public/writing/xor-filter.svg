<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .bg { fill: #0A0A0C; }
      .grid { stroke: #16161D; stroke-width: 1; stroke-dasharray: 4 4; }
      .box-panel { fill: #111116; stroke: #23232E; stroke-width: 1.5; }
      .mono-head { font-family: 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; fill: #71717A; letter-spacing: 0.12em; }
      .mono-title { font-family: 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 15px; font-weight: 600; fill: #EDEDED; letter-spacing: 0.04em; }
      .mono-sub { font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; fill: #A1A1AA; }
      .code-font { font-family: 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #FCD34D; }
      .text-desc { font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11.5px; fill: #CBD5E1; }
      .block-rect { fill: #181822; stroke: #2E2E3E; stroke-width: 1; }
      .block-active { fill: #78350F; stroke: #F59E0B; stroke-width: 1.5; }
      .stat-val { font-family: 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #EDEDED; }
      .stat-lbl { font-family: 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 9.5px; fill: #64748B; }
      .xor-sym { font-family: 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 16px; font-weight: 600; fill: #F59E0B; text-anchor: middle; }
    </style>
  </defs>

  <rect width="860" height="460" class="bg" />

  <line x1="30" y1="0" x2="30" y2="460" class="grid" />
  <line x1="830" y1="0" x2="830" y2="460" class="grid" />
  <line x1="0" y1="45" x2="860" y2="45" class="grid" />
  <line x1="0" y1="415" x2="860" y2="415" class="grid" />

  <!-- Header -->
  <text x="40" y="28" class="mono-head">FIG 3.0 // IMMUTABLE AMQ DATA STRUCTURE</text>
  <text x="40" y="70" class="mono-title">XOR FILTER (2019) — 3-WAY PEELING &amp; GF(2) LINEAR SOLVING</text>
  <text x="40" y="90" class="mono-sub">Eliminates hash table collision handling. Evaluates membership via 3-way linear XOR equation: B[h0] ⊕ B[h1] ⊕ B[h2] == fp(x).</text>

  <!-- LEFT PANEL: 3-Segment Disjoint Memory Layout -->
  <g transform="translate(40, 115)">
    <rect width="360" height="275" rx="4" class="box-panel" />
    <text x="16" y="26" class="mono-head" fill="#F59E0B">3 DISJOINT ARRAY PARTITIONS</text>

    <!-- Formula Equation Card -->
    <rect x="16" y="42" width="328" height="40" rx="3" fill="#241407" stroke="#B45309" />
    <text x="24" y="66" class="code-font" font-size="11px">B0[h0(x)] ⊕ B1[h1(x)] ⊕ B2[h2(x)] == fp(x)</text>

    <!-- 3 Partition Boxes -->
    <g transform="translate(16, 96)">
      <!-- Partition B0 -->
      <g transform="translate(0, 0)">
        <rect width="100" height="60" rx="2" class="block-rect" />
        <text x="10" y="18" class="stat-lbl">Block B0</text>
        <rect x="10" y="26" width="80" height="24" rx="2" class="block-active" />
        <text x="24" y="42" class="code-font" font-size="10px">B0[h0] = 0x12</text>
      </g>
      <text x="112" y="36" class="xor-sym">⊕</text>

      <!-- Partition B1 -->
      <g transform="translate(124, 0)">
        <rect width="100" height="60" rx="2" class="block-rect" />
        <text x="10" y="18" class="stat-lbl">Block B1</text>
        <rect x="10" y="26" width="80" height="24" rx="2" class="block-active" />
        <text x="24" y="42" class="code-font" font-size="10px">B1[h1] = 0x48</text>
      </g>
      <text x="236" y="36" class="xor-sym">⊕</text>

      <!-- Partition B2 -->
      <g transform="translate(248, 0)">
        <rect width="80" height="60" rx="2" class="block-rect" />
        <text x="10" y="18" class="stat-lbl">Block B2</text>
        <rect x="10" y="26" width="60" height="24" rx="2" class="block-active" />
        <text x="18" y="42" class="code-font" font-size="10px">B2[h2]</text>
      </g>
    </g>

    <text x="16" y="180" class="text-desc">• Key hashes deterministically into B0, B1, B2.</text>
    <text x="16" y="200" class="text-desc">• Lookup executes exactly 3 memory reads.</text>
    <text x="16" y="220" class="text-desc">• Zero branch prediction overhead in CPU.</text>
    <text x="16" y="240" class="text-desc">• Evaluates in ~12–15 nanoseconds.</text>
  </g>

  <!-- RIGHT PANEL: Hypergraph Peeling & Construction -->
  <g transform="translate(420, 115)">
    <rect width="400" height="275" rx="4" class="box-panel" />
    <text x="20" y="26" class="mono-head" fill="#FCD34D">HOW CONSTRUCTION WORKS: HYPERGRAPH PEELING</text>

    <!-- Peeling Steps -->
    <g transform="translate(20, 45)">
      <!-- Step 1 -->
      <rect x="0" y="0" width="360" height="50" rx="3" fill="#181822" stroke="#2D2D3D" />
      <text x="12" y="18" class="mono-head" fill="#F59E0B">STEP 1: 3-XORSAT SYSTEM MAPPING</text>
      <text x="12" y="36" class="text-desc">Keys are modeled as hyperedges connecting 3 slots across B0, B1, B2.</text>

      <!-- Step 2 -->
      <rect x="0" y="58" width="360" height="50" rx="3" fill="#181822" stroke="#2D2D3D" />
      <text x="12" y="18" class="mono-head" fill="#F59E0B">STEP 2: ITERATIVE PEELING</text>
      <text x="12" y="36" class="text-desc">Find a slot touched by only 1 key (degree 1). Peel it and push to stack.</text>

      <!-- Step 3 -->
      <rect x="0" y="116" width="360" height="54" rx="3" fill="#181822" stroke="#2D2D3D" />
      <text x="12" y="18" class="mono-head" fill="#F59E0B">STEP 3: BACKWARD ASSIGNMENT</text>
      <text x="12" y="34" class="text-desc">Pop from stack: set the degree-1 slot value so the XOR equation</text>
      <text x="12" y="48" class="text-desc">equals the key's fingerprint. Guaranteed solution with ~1.23x capacity.</text>
    </g>

    <!-- Telemetry Stats row -->
    <line x1="20" y1="235" x2="380" y2="235" stroke="#22222E" />
    <text x="20" y="255" class="stat-lbl">SPACE: <tspan class="stat-val">~9.8 bits/key</tspan></text>
    <text x="150" y="255" class="stat-lbl">MUTABILITY: <tspan class="stat-val" fill="#F59E0B">Immutable</tspan></text>
    <text x="275" y="255" class="stat-lbl">SEEK COST: <tspan class="stat-val">Exactly 3 reads</tspan></text>
  </g>

  <!-- Bottom Telemetry Footer -->
  <text x="40" y="440" class="mono-head">VERDICT // PERFECT FOR READ-ONLY DATASETS WHERE LOOKUP SPEED AND 3-READ DETERMINISM OUTWEIGH DYNAMIC MUTABILITY</text>
</svg>
