<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      .bg { fill: #09090b; stroke: #27272a; stroke-width: 1.2; }
      .glyph { fill: #fafafa; }
      .status { fill: #10b981; }
      .halo { fill: #10b981; fill-opacity: 0.25; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; stroke: #e4e4e7; stroke-width: 1.2; }
        .glyph { fill: #09090b; }
        .status { fill: #059669; }
        .halo { fill: #059669; fill-opacity: 0.2; }
      }
    </style>
  </defs>

  <!-- Container Squircle with technical border -->
  <rect class="bg" x="1" y="1" width="30" height="30" rx="7.5" fill="#09090b" stroke="#27272a" stroke-width="1.2" />

  <!-- Monogram A (Architectural / Modernist geometry) -->
  <path
    class="glyph"
    fill="#fafafa"
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M14.4 7.2h3.2l5.8 15.8h-3.8l-1.3-3.8h-4.6l-1.3 3.8H8.6L14.4 7.2zm1.6 4.3l-1.6 4.8h3.2L16 11.5z"
  />

  <!-- Signature System Status / Availability Pulse -->
  <circle class="halo" cx="24" cy="8" r="3.2" fill="#10b981" fill-opacity="0.25" />
  <circle class="status" cx="24" cy="8" r="2" fill="#10b981" />
</svg>