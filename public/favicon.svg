<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <defs>
    <style>
      .bg { fill: #09090b; stroke: #27272a; stroke-width: 1.5; }
      .glyph { fill: #fafafa; }
      .beacon { fill: #10b981; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; stroke: #d4d4d8; stroke-width: 1.5; }
        .glyph { fill: #09090b; }
        .beacon { fill: #059669; }
      }
    </style>
  </defs>

  <!-- Base Squircle Container with Technical Border -->
  <rect class="bg" x="1.5" y="1.5" width="29" height="29" rx="6" />

  <!-- Stepped Pixel 'A' Monogram (Ahmed) -->
  <!-- Top Crossbar -->
  <rect class="glyph" x="12" y="6" width="8" height="4" />
  <!-- Left Column -->
  <rect class="glyph" x="8" y="10" width="4" height="16" />
  <!-- Right Column -->
  <rect class="glyph" x="20" y="10" width="4" height="16" />
  <!-- Center Bridge -->
  <rect class="glyph" x="12" y="16" width="8" height="4" />

  <!-- Signature Emerald Beacon Pixel (Status: Available) -->
  <rect class="beacon" x="24" y="4" width="4" height="4" />
</svg>